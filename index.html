<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Untuk Istriku ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #ff758c,
        #ff7eb3,
        #a18cd1
    );
}

/* Kartu utama */

.card {
    width: 90%;
    max-width: 500px;

    padding: 40px 25px;

    text-align: center;
    color: white;

    background: rgba(255,255,255,0.15);

    border: 1px solid rgba(255,255,255,0.3);

    border-radius: 25px;

    backdrop-filter: blur(12px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.25);

    z-index: 10;
}

h1 {
    font-size: 38px;
    margin-bottom: 20px;
}

.message {
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 25px;
}

/* Tombol */

button {
    border: none;

    padding: 15px 30px;

    border-radius: 50px;

    background: white;

    color: #ff4f81;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.25);

    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

/* Tulisan SABLENG */

#surprise {
    display: none;

    margin-top: 30px;

    animation: muncul 1s ease;
}

.sableng {
    font-size: 65px;

    font-weight: bold;

    letter-spacing: 5px;

    text-shadow:
        0 0 10px white,
        0 0 20px #ff4f81,
        0 0 40px #ff4f81;

    animation:
        goyang 0.5s infinite alternate;
}

.sub {
    margin-top: 15px;

    font-size: 20px;
}

/* Animasi muncul */

@keyframes muncul {

    0% {
        opacity: 0;
        transform: scale(0);
    }

    70% {
        transform: scale(1.2);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}

/* Animasi tulisan */

@keyframes goyang {

    from {
        transform: rotate(-3deg) scale(1);
    }

    to {
        transform: rotate(3deg) scale(1.08);
    }

}

/* Hati terbang */

.heart {
    position: absolute;

    bottom: -40px;

    font-size: 25px;

    animation: naik linear forwards;

    opacity: 0.8;

    z-index: 1;
}

@keyframes naik {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }

}

</style>

</head>

<body>

<div class="card">

    <h1>Untuk Istriku ❤️</h1>

    <div class="message">

        Ada sesuatu yang ingin aku sampaikan...

        <br><br>

        Terima kasih sudah selalu ada
        di sampingku. ❤️

        <br>

        Kamu adalah orang yang sangat
        berarti dalam hidupku.

        <br><br>

        Tapi sebelum lanjut...

    </div>


    <button onclick="kejutan()">
        KLIK AKU ❤️
    </button>


    <div id="surprise">

        <div class="sableng">
            SABLENG 😂❤️
        </div>

        <div class="sub">
            Istriku memang paling sableng...
            <br>
            tapi tetap paling aku sayang 🥰❤️
        </div>

    </div>

</div>


<script>

/* Membuat hati terbang */

function buatHati() {

    const hati = document.createElement("div");

    hati.className = "heart";

    hati.innerHTML = "❤️";

    hati.style.left =
        Math.random() * 100 + "vw";

    hati.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    hati.style.fontSize =
        (15 + Math.random() * 30) + "px";

    document.body.appendChild(hati);

    setTimeout(() => {

        hati.remove();

    }, 8000);

}


/* Hati muncul terus */

setInterval(buatHati, 400);


/* Tombol kejutan */

function kejutan() {

    document.getElementById("surprise").style.display = "block";

}

</script>

</body>

</html>
